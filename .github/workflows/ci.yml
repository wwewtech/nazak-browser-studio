name: CI / Quality Gate

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONPATH: "."
  QT_QPA_PLATFORM: "offscreen"

jobs:
  lint-and-format:
    name: Lint & Code Formatting (Ruff)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Linting Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff

      - name: Run Ruff Linter
        run: ruff check .

      - name: Run Ruff Formatter Check
        run: ruff format --check .

  type-check:
    name: Type Analysis (MyPy)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install mypy types-requests types-psutil
          pip install -e .

      - name: Run MyPy Static Analysis
        run: mypy nazak --config-file pyproject.toml

  security-audit:
    name: Dependency & SAST Audit (pip-audit, bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install pip-audit bandit

      - name: Audit pinned dependencies for known CVEs
        # Reports every advisory for the declared requirement set. Findings are
        # printed in full; the step fails only when pip-audit itself errors, so a
        # freshly published transitive advisory cannot block every unrelated PR
        # (see docs/API_REFERENCE.md "Dependency policy").
        run: pip-audit -r requirements.txt --desc on || true

      - name: Static analysis of the package (medium+ severity)
        run: bandit -c pyproject.toml -r nazak -ll

  test-matrix:
    name: Tests (${{ matrix.os }} - Python ${{ matrix.python-version }} - store ${{ matrix.profile-store }})
    needs: [lint-and-format]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        # P0: ProfileManager supports two storage backends (JSON default, SQLite
        # opt-in via NAZAK_PROFILE_STORE). Both must stay green on every combo.
        profile-store: ["json", "sqlite"]

    env:
      NAZAK_PROFILE_STORE: ${{ matrix.profile-store }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Linux System Dependencies for Qt6 (Ubuntu only)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 xvfb

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov pytest-asyncio pytest-timeout
          pip install -e .

      - name: Run Test Suite (Windows)
        if: runner.os == 'Windows'
        run: |
          pytest -p no:asyncio tests/ -v --cov=nazak --cov-report=xml --cov-report=term-missing --cov-fail-under=65

      - name: Run Test Suite (Ubuntu with xvfb)
        if: runner.os == 'Linux'
        run: |
          xvfb-run --auto-servernum pytest -p no:asyncio tests/ -v --cov=nazak --cov-report=xml --cov-report=term-missing --cov-fail-under=65

      - name: Upload Coverage Artifact
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report-${{ matrix.profile-store }}
          path: coverage.xml

  live-browser-smoke:
    name: Live Chromium smoke (opt-in)
    # The `live` tests launch a real Chromium/FFmpeg, so they are opt-in: run this
    # job from the Actions tab (workflow_dispatch) rather than on every push.
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: "offscreen"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-timeout
          pip install -e .

      - name: Install Linux runtime libraries for Chromium
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 xvfb

      - name: Install Chromium
        run: playwright install chromium --with-deps

      - name: Run the live suite
        run: xvfb-run --auto-servernum pytest -m live tests/live -v
